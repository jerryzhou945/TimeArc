name: Cleanup merged PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-head-branch:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = new Set(["dev", "main", "master"]);

            if (protectedBranches.has(branch) || branch.startsWith("release/")) {
              core.info(`Skip protected branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`Branch already absent or not deletable: ${branch}`);
                return;
              }
              throw error;
            }
