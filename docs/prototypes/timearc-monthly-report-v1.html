<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeArc 月度时间报告 Prototype</title>
  <style>
    :root {
      --bg0: #03060d;
      --bg1: #091423;
      --bg2: #17101b;
      --ink: #f6fbff;
      --muted: rgba(246, 251, 255, .66);
      --faint: rgba(246, 251, 255, .42);
      --line: rgba(255, 255, 255, .14);
      --panel: rgba(255, 255, 255, .075);
      --panel-strong: rgba(255, 255, 255, .12);
      --aqua: #83f0ff;
      --violet: #9b8bff;
      --pink: #f08ab7;
      --gold: #ffe59a;
      --green: #92f0bd;
      --orange: #ffb46f;
      color: var(--ink);
      color-scheme: dark;
      font-family: Inter, "SF Pro Display", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 6% 0%, rgba(131, 240, 255, .26), transparent 30%),
        radial-gradient(circle at 92% 2%, rgba(155, 139, 255, .24), transparent 32%),
        radial-gradient(circle at 60% 102%, rgba(240, 138, 183, .18), transparent 40%),
        linear-gradient(135deg, var(--bg0), var(--bg1) 48%, var(--bg2));
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .prototype {
      width: 100vw;
      height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
    }

    .recap-shell {
      position: relative;
      width: min(1420px, calc(100vw - 40px));
      height: min(820px, calc(100vh - 40px));
      min-height: 680px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 32px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .035)),
        rgba(5, 10, 18, .92);
      box-shadow:
        0 34px 110px rgba(0, 0, 0, .58),
        inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .recap-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 38%, #000, transparent 76%);
      pointer-events: none;
    }

    .ambient {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 28%, rgba(131, 240, 255, .28), transparent 22%),
        radial-gradient(circle at 64% 36%, rgba(155, 139, 255, .26), transparent 26%),
        radial-gradient(circle at 48% 88%, rgba(255, 229, 154, .15), transparent 25%);
      filter: blur(34px);
      opacity: .7;
      transform: rotate(-8deg);
      animation: floatAura 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      inset: -40% -10%;
      background: linear-gradient(105deg, transparent 32%, rgba(131, 240, 255, .10), rgba(155, 139, 255, .14), rgba(255, 255, 255, .08), transparent 68%);
      transform: rotate(-8deg);
      opacity: .72;
      animation: waveDrift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 4;
      height: 72px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, .10);
      background: rgba(4, 8, 15, .26);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 58% 40%, #fff 0 9%, transparent 10%),
        conic-gradient(from 210deg, var(--aqua), var(--violet), var(--pink), var(--gold), var(--aqua));
      box-shadow: 0 0 26px rgba(131, 240, 255, .24);
    }

    .brand strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .control-btn {
      height: 38px;
      min-width: 38px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      color: rgba(246, 251, 255, .78);
      background: rgba(255, 255, 255, .07);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .control-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(131, 240, 255, .42);
      background: rgba(131, 240, 255, .10);
    }

    .control-btn.primary {
      color: #071018;
      border-color: transparent;
      background: linear-gradient(135deg, var(--aqua), var(--gold));
      font-weight: 800;
      box-shadow: 0 0 30px rgba(131, 240, 255, .20);
    }

    .content {
      position: relative;
      z-index: 3;
      height: calc(100% - 72px);
      padding: 22px 22px 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
    }

    .story-stage {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 96%, rgba(155, 139, 255, .18), transparent 36%),
        rgba(3, 7, 13, .58);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .slides {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 42px;
      opacity: 0;
      transform: translateY(24px) scale(.985);
      transition: opacity .42s ease, transform .56s cubic-bezier(.16, .9, .2, 1);
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(131, 240, 255, .24);
      border-radius: 999px;
      color: #b8f8ff;
      background: rgba(131, 240, 255, .09);
      font-size: 13px;
      font-weight: 700;
    }

    .kicker::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--aqua);
      box-shadow: 0 0 18px var(--aqua);
    }

    .title-xl {
      margin-top: 22px;
      max-width: 740px;
      font-size: clamp(48px, 7vw, 92px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 900;
    }

    .title-lg {
      margin-top: 18px;
      max-width: 760px;
      font-size: clamp(38px, 5vw, 68px);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 900;
    }

    .sub {
      max-width: 720px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .cover-grid {
      height: 100%;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 28px;
      align-items: center;
    }

    .cover-copy {
      position: relative;
      z-index: 2;
    }

    .month-seal {
      position: relative;
      min-height: 520px;
      display: grid;
      place-items: center;
    }

    .seal-ring {
      position: absolute;
      width: min(38vw, 460px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .16);
      background:
        radial-gradient(circle, rgba(246, 251, 255, .14), transparent 30%),
        conic-gradient(from 215deg, rgba(131, 240, 255, .05), rgba(131, 240, 255, .48), rgba(155, 139, 255, .34), rgba(240, 138, 183, .28), rgba(255, 229, 154, .44), rgba(131, 240, 255, .05));
      box-shadow:
        0 0 80px rgba(131, 240, 255, .16),
        inset 0 0 70px rgba(255, 255, 255, .08);
      animation: slowSpin 26s linear infinite;
    }

    .seal-ring:nth-child(2) {
      width: min(31vw, 370px);
      opacity: .74;
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .seal-ring:nth-child(3) {
      width: min(23vw, 280px);
      opacity: .62;
      animation-duration: 16s;
    }

    .total-orb {
      position: relative;
      width: 310px;
      min-height: 310px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .30), transparent 16%),
        radial-gradient(circle at 50% 54%, rgba(131, 240, 255, .24), transparent 45%),
        linear-gradient(145deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, .32),
        0 0 54px rgba(131, 240, 255, .18),
        inset 0 1px 0 rgba(255, 255, 255, .16);
      backdrop-filter: blur(10px);
    }

    .total-orb strong {
      display: block;
      font-size: 64px;
      line-height: .9;
      color: #fff5c9;
      text-shadow: 0 0 26px rgba(255, 229, 154, .36);
    }

    .total-orb span {
      display: block;
      margin-top: 10px;
      color: rgba(246, 251, 255, .72);
      font-size: 14px;
      font-weight: 800;
    }

    .hero-metrics {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 650px;
    }

    .metric-tile {
      min-height: 86px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 20px;
      background: rgba(255, 255, 255, .075);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .metric-tile span {
      display: block;
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-tile strong {
      display: block;
      margin-top: 8px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .persona-wrap {
      height: 100%;
      display: grid;
      grid-template-columns: .86fr 1.14fr;
      gap: 28px;
      align-items: center;
    }

    .portrait-card {
      position: relative;
      height: 540px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 30px;
      background:
        radial-gradient(circle at 52% 34%, rgba(255, 229, 154, .30), transparent 21%),
        radial-gradient(circle at 40% 48%, rgba(131, 240, 255, .20), transparent 35%),
        linear-gradient(165deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04));
      box-shadow: 0 26px 80px rgba(0, 0, 0, .34);
    }

    .portrait-card::before {
      content: "";
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow:
        0 0 0 34px rgba(131, 240, 255, .04),
        0 0 0 78px rgba(155, 139, 255, .035),
        0 0 70px rgba(255, 229, 154, .16);
    }

    .persona-name {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 28px;
    }

    .persona-name strong {
      display: block;
      font-size: 46px;
      line-height: 1.02;
    }

    .persona-name span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
    }

    .badge-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .badge {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      color: rgba(246, 251, 255, .82);
      background: rgba(255, 255, 255, .075);
      font-weight: 800;
    }

    .badge b {
      color: var(--gold);
      font-size: 18px;
    }

    .quote-panel {
      margin-top: 28px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(131, 240, 255, .10), rgba(255, 255, 255, .05) 46%, rgba(240, 138, 183, .09));
      color: rgba(246, 251, 255, .84);
      font-size: 20px;
      line-height: 1.6;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .river-layout {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 24px;
    }

    .river-head {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
    }

    .month-river {
      position: relative;
      min-height: 360px;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(30, minmax(14px, 1fr));
      gap: 9px;
      align-items: end;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .035)),
        rgba(2, 8, 16, .38);
      overflow: hidden;
    }

    .month-river::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 52%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .20), transparent);
    }

    .day-bar {
      position: relative;
      min-width: 0;
      height: calc(var(--h) * 1%);
      min-height: 24px;
      border-radius: 999px 999px 8px 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(131, 240, 255, .80) 20%, rgba(155, 139, 255, .62) 70%, rgba(240, 138, 183, .42));
      box-shadow:
        0 0 20px rgba(131, 240, 255, calc(.05 + var(--h) * .003)),
        inset 0 1px 0 rgba(255, 255, 255, .42);
      animation: barRise .7s cubic-bezier(.16, .9, .2, 1) both;
      animation-delay: calc(var(--i) * 20ms);
    }

    .day-bar.hot {
      background:
        linear-gradient(180deg, #fff7cf, #ffe59a 20%, #ffa6cf 62%, #8ef2ff);
      box-shadow:
        0 0 34px rgba(255, 229, 154, .28),
        0 0 52px rgba(240, 138, 183, .16);
    }

    .day-bar span {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      color: rgba(246, 251, 255, .42);
      font-size: 10px;
    }

    .river-callouts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-width: 430px;
      max-width: 520px;
    }

    .callout {
      min-height: 96px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: rgba(255, 255, 255, .075);
    }

    .callout span {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
    }

    .callout strong {
      display: block;
      margin-top: 9px;
      font-size: 25px;
      line-height: 1.05;
    }

    .apps-layout {
      height: 100%;
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      gap: 28px;
      align-items: center;
    }

    .app-hero {
      position: relative;
      height: 560px;
      display: grid;
      place-items: center;
    }

    .orbit-line {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 50%;
    }

    .orbit-line.one { width: 480px; height: 300px; transform: rotate(-14deg); }
    .orbit-line.two { width: 360px; height: 520px; transform: rotate(24deg); opacity: .72; }
    .orbit-line.three { width: 280px; height: 280px; opacity: .52; }

    .app-core {
      position: relative;
      width: 230px;
      height: 230px;
      border-radius: 46px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 54% 28%, rgba(255, 255, 255, .28), transparent 13%),
        conic-gradient(from 180deg, #47c78d, #68a1ff, #ff6e72, #ffd35c, #47c78d);
      box-shadow:
        0 0 90px rgba(131, 240, 255, .20),
        0 34px 90px rgba(0, 0, 0, .35);
    }

    .app-core::after {
      content: "VS";
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      color: #071018;
      background: rgba(255, 255, 255, .88);
      font-size: 32px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 #fff;
    }

    .app-list {
      display: grid;
      gap: 12px;
    }

    .app-row {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: rgba(255, 255, 255, .075);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .app-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #071018;
      font-weight: 900;
      background: var(--app-color);
      box-shadow: 0 0 26px color-mix(in srgb, var(--app-color), transparent 72%);
    }

    .app-row h3 {
      font-size: 18px;
    }

    .app-row p {
      margin-top: 5px;
      color: var(--faint);
      font-size: 12px;
    }

    .app-row strong {
      color: #fff5c9;
      font-size: 22px;
    }

    .rhythm-layout {
      height: 100%;
      display: grid;
      grid-template-columns: .95fr 1.05fr;
      gap: 28px;
      align-items: center;
    }

    .clock-card {
      position: relative;
      height: 560px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 229, 154, .18), transparent 18%),
        linear-gradient(160deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .035));
      overflow: hidden;
    }

    .clock-face {
      width: 380px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(3, 7, 13, .92) 0 34%, transparent 35%),
        conic-gradient(from -90deg,
          rgba(131, 240, 255, .16) 0 15deg,
          rgba(131, 240, 255, .62) 15deg 72deg,
          rgba(155, 139, 255, .28) 72deg 138deg,
          rgba(240, 138, 183, .60) 138deg 210deg,
          rgba(255, 229, 154, .70) 210deg 282deg,
          rgba(131, 240, 255, .18) 282deg 360deg);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow:
        0 0 60px rgba(131, 240, 255, .18),
        inset 0 0 0 16px rgba(255, 255, 255, .045),
        inset 0 0 0 44px rgba(255, 255, 255, .035);
      display: grid;
      place-items: center;
    }

    .clock-face strong {
      display: block;
      text-align: center;
      color: #fff5c9;
      font-size: 54px;
      line-height: .98;
    }

    .clock-face span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .rhythm-strips {
      display: grid;
      gap: 16px;
    }

    .strip {
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: rgba(255, 255, 255, .075);
    }

    .strip-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .strip-track {
      position: relative;
      height: 12px;
      margin-top: 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .10);
      overflow: hidden;
    }

    .seg {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--x) * 1%);
      width: calc(var(--w) * 1%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--aqua), var(--violet), var(--pink));
      box-shadow: 0 0 18px rgba(131, 240, 255, .22);
    }

    .poster-layout {
      height: 100%;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 34px;
      align-items: center;
    }

    .share-poster {
      position: relative;
      width: 390px;
      height: 620px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 34px;
      background:
        radial-gradient(circle at 54% 20%, rgba(255, 245, 201, .36), transparent 18%),
        radial-gradient(circle at 26% 40%, rgba(131, 240, 255, .25), transparent 34%),
        radial-gradient(circle at 80% 78%, rgba(240, 138, 183, .22), transparent 32%),
        linear-gradient(160deg, #101b2a, #080b13 50%, #1a0e17);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, .44),
        0 0 70px rgba(255, 229, 154, .14);
    }

    .share-poster::before {
      content: "";
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 26px;
      pointer-events: none;
    }

    .poster-orbit {
      position: absolute;
      left: 50%;
      top: 210px;
      width: 420px;
      height: 420px;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .13);
      box-shadow:
        inset 0 0 0 22px rgba(131, 240, 255, .035),
        inset 0 0 0 56px rgba(155, 139, 255, .035),
        0 0 50px rgba(255, 229, 154, .16);
    }

    .poster-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 38px;
      display: flex;
      flex-direction: column;
    }

    .poster-brand {
      display: flex;
      justify-content: space-between;
      color: rgba(246, 251, 255, .62);
      font-size: 12px;
      font-weight: 800;
    }

    .poster-title {
      margin-top: 54px;
      font-size: 44px;
      line-height: 1.04;
      font-weight: 900;
    }

    .poster-total {
      margin-top: 48px;
      color: #fff5c9;
      font-size: 76px;
      line-height: .9;
      font-weight: 900;
      text-shadow: 0 0 28px rgba(255, 229, 154, .28);
    }

    .poster-caption {
      margin-top: 16px;
      color: rgba(246, 251, 255, .74);
      line-height: 1.65;
    }

    .poster-foot {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .poster-mini {
      min-height: 70px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 18px;
      background: rgba(255, 255, 255, .075);
    }

    .poster-mini span {
      display: block;
      color: rgba(246, 251, 255, .46);
      font-size: 11px;
      font-weight: 800;
    }

    .poster-mini strong {
      display: block;
      margin-top: 7px;
      font-size: 19px;
    }

    .poster-copy .title-lg {
      max-width: 620px;
    }

    .share-points {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 650px;
    }

    .share-point {
      min-height: 118px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 22px;
      background: rgba(255, 255, 255, .075);
    }

    .share-point strong {
      display: block;
      font-size: 22px;
    }

    .share-point span {
      display: block;
      margin-top: 9px;
      color: var(--faint);
      line-height: 1.55;
      font-size: 13px;
    }

    .nav-rail {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 28px;
      background: rgba(3, 7, 13, .48);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
    }

    .rail-head {
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .10);
    }

    .rail-head span {
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .rail-head strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
    }

    .nav-list {
      padding: 14px;
      display: grid;
      gap: 9px;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
      min-height: 62px;
      padding: 12px;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 18px;
      text-align: left;
      color: rgba(246, 251, 255, .72);
      background: rgba(255, 255, 255, .055);
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--ink);
      border-color: rgba(131, 240, 255, .28);
      background: rgba(131, 240, 255, .12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .nav-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, .08);
      color: var(--faint);
      font-size: 12px;
      font-weight: 900;
    }

    .nav-item.active .nav-num {
      color: #071018;
      background: linear-gradient(135deg, var(--aqua), var(--gold));
    }

    .nav-title {
      display: block;
      font-size: 14px;
      font-weight: 900;
    }

    .nav-desc {
      display: block;
      margin-top: 3px;
      color: var(--faint);
      font-size: 11px;
    }

    .progress {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 20px;
      z-index: 5;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: var(--p);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--aqua), var(--violet), var(--pink), var(--gold));
      transition: width .34s ease;
    }

    @keyframes floatAura {
      from { transform: translate3d(-1%, -1%, 0) rotate(-8deg) scale(1); }
      to { transform: translate3d(1.2%, 1%, 0) rotate(-6deg) scale(1.04); }
    }

    @keyframes waveDrift {
      from { transform: translateX(-4%) rotate(-8deg); }
      to { transform: translateX(4%) rotate(-8deg); }
    }

    @keyframes slowSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes barRise {
      from { height: 24px; opacity: .15; transform: translateY(20px); }
      to { height: calc(var(--h) * 1%); opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .prototype {
        height: auto;
        min-height: 100vh;
        padding: 12px;
      }
      .recap-shell {
        width: 100%;
        height: auto;
        min-height: 900px;
      }
      .topbar {
        height: auto;
        padding: 16px;
        gap: 14px;
        align-items: flex-start;
        flex-direction: column;
      }
      .content {
        height: auto;
        min-height: 760px;
        grid-template-columns: 1fr;
      }
      .nav-rail { display: none; }
      .story-stage {
        min-height: 760px;
      }
      .slide {
        padding: 28px;
      }
      .cover-grid,
      .persona-wrap,
      .apps-layout,
      .rhythm-layout,
      .poster-layout {
        grid-template-columns: 1fr;
      }
      .month-seal,
      .portrait-card,
      .app-hero,
      .clock-card {
        min-height: 360px;
        height: 360px;
      }
      .river-head {
        align-items: stretch;
        flex-direction: column;
      }
      .river-callouts,
      .hero-metrics,
      .share-points {
        min-width: 0;
        grid-template-columns: 1fr;
      }
      .share-poster {
        width: min(390px, 100%);
        height: 590px;
      }
    }
  </style>
</head>
<body>
  <main class="prototype">
    <section class="recap-shell" aria-label="TimeArc 月度时间报告原型">
      <div class="ambient"></div>
      <div class="wave"></div>

      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <strong>TimeArc Memory Lake</strong>
            <span>2026.06 月度时间故事</span>
          </div>
        </div>
        <div class="toolbar" aria-label="报告控制">
          <button class="control-btn" id="prevBtn" type="button">上一页</button>
          <button class="control-btn primary" id="posterBtn" type="button">分享海报</button>
          <button class="control-btn" id="nextBtn" type="button">下一页</button>
        </div>
      </header>

      <div class="content">
        <section class="story-stage">
          <div class="slides" id="slides"></div>
        </section>

        <aside class="nav-rail">
          <div class="rail-head">
            <span>REPORT STEPS</span>
            <strong>让数据变成可分享的故事</strong>
          </div>
          <div class="nav-list" id="navList"></div>
        </aside>
      </div>

      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </section>
  </main>

  <script>
    const report = {
      month: "2026.06",
      title: "六月时间报告",
      total: "168h 45m",
      persona: "深夜创作型",
      line: "你把这个月的大部分屏幕时间，留给了创造、查找和整理。",
      metrics: [
        ["专注天数", "24 天"],
        ["最长一天", "9h 42m"],
        ["连续记录", "11 天"]
      ],
      callouts: [
        ["峰值日", "06.18", "9h42m"],
        ["低潮日", "06.04", "1h16m"],
        ["平均每日", "5h37m", "比上月 +12%"]
      ],
      apps: [
        { name: "VS Code", tag: "创作主角", time: "50h31m", color: "#82efff", icon: "VS" },
        { name: "Chrome", tag: "查找与阅读", time: "34h02m", color: "#ffe59a", icon: "Ch" },
        { name: "Figma", tag: "视觉推演", time: "22h14m", color: "#f08ab7", icon: "Fg" },
        { name: "WeChat", tag: "沟通回声", time: "18h20m", color: "#92f0bd", icon: "Wx" },
        { name: "Terminal", tag: "系统底层", time: "12h36m", color: "#9b8bff", icon: "Tm" }
      ],
      daily: [34, 46, 28, 16, 42, 55, 61, 44, 57, 63, 38, 49, 66, 72, 51, 58, 70, 100, 75, 68, 46, 59, 62, 74, 65, 80, 71, 84, 56, 69],
      strips: [
        { name: "上午", apps: "Chrome / WeChat", segs: [[10, 22], [42, 18], [70, 10]] },
        { name: "下午", apps: "VS Code / Figma", segs: [[6, 34], [48, 28], [82, 9]] },
        { name: "夜晚", apps: "VS Code / Terminal", segs: [[18, 24], [52, 32], [88, 8]] }
      ]
    };

    const slides = [
      {
        title: "封面",
        desc: "总时长与月度称号",
        render: coverSlide
      },
      {
        title: "时间人格",
        desc: "从数字提炼人设",
        render: personaSlide
      },
      {
        title: "时间河流",
        desc: "每日起伏更有画面",
        render: riverSlide
      },
      {
        title: "应用主角",
        desc: "本月陪伴你的软件",
        render: appsSlide
      },
      {
        title: "昼夜节律",
        desc: "什么时候最活跃",
        render: rhythmSlide
      },
      {
        title: "分享海报",
        desc: "一张图总结这个月",
        render: posterSlide
      }
    ];

    const slidesEl = document.getElementById("slides");
    const navEl = document.getElementById("navList");
    const progressEl = document.getElementById("progressBar");
    let active = 0;

    function metricTiles(items) {
      return items.map(([label, value]) => `
        <div class="metric-tile">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function coverSlide() {
      return `
        <div class="cover-grid">
          <div class="cover-copy">
            <div class="kicker">${report.month} TIME RECAP</div>
            <h1 class="title-xl">${report.title}<br>${report.persona}</h1>
            <p class="sub">${report.line} 这版报告把数据做成“可回忆、可截图、可转发”的故事页，而不是单纯的表格。</p>
            <div class="hero-metrics">${metricTiles(report.metrics)}</div>
          </div>
          <div class="month-seal">
            <div class="seal-ring"></div>
            <div class="seal-ring"></div>
            <div class="seal-ring"></div>
            <div class="total-orb">
              <div>
                <strong>${report.total}</strong>
                <span>本月累计使用时间</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function personaSlide() {
      return `
        <div class="persona-wrap">
          <div class="portrait-card">
            <div class="persona-name">
              <strong>${report.persona}</strong>
              <span>你的时间不是平均铺开，而是集中在一段段高密度创作里。</span>
            </div>
          </div>
          <div>
            <div class="kicker">PERSONALITY FROM DATA</div>
            <h2 class="title-lg">把“用了多久”变成“我是怎样的人”</h2>
            <p class="sub">分享欲来自身份感。比起只展示 168 小时，更适合告诉用户：你这个月像一个怎样的人，你的节奏和别人有什么不同。</p>
            <div class="badge-cloud">
              <span class="badge"><b>42%</b> 深度创作</span>
              <span class="badge"><b>11</b> 天连续记录</span>
              <span class="badge"><b>22:40</b> 夜间高峰</span>
              <span class="badge"><b>Top 1</b> VS Code</span>
            </div>
            <div class="quote-panel">“这个月，你不是被时间推着走的人。你把很多碎片，整理成了能继续向前的轨迹。”</div>
          </div>
        </div>
      `;
    }

    function riverSlide() {
      const bars = report.daily.map((h, i) => `
        <div class="day-bar ${h >= 84 ? "hot" : ""}" style="--h:${h}; --i:${i}">
          ${i % 5 === 0 ? `<span>${String(i + 1).padStart(2, "0")}</span>` : ""}
        </div>
      `).join("");
      const callouts = report.callouts.map(([a, b, c]) => `
        <div class="callout">
          <span>${a}</span>
          <strong>${b}</strong>
          <span>${c}</span>
        </div>
      `).join("");

      return `
        <div class="river-layout">
          <div class="river-head">
            <div>
              <div class="kicker">TIME RIVER</div>
              <h2 class="title-lg">这个月的时间，不是直线，是一条有起伏的河</h2>
              <p class="sub">用每日强弱变化替代表格，让用户一眼看到“什么时候冲刺、什么时候休息”。高峰日用暖金色点亮，更适合作为报告里的记忆点。</p>
            </div>
            <div class="river-callouts">${callouts}</div>
          </div>
          <div class="month-river">${bars}</div>
        </div>
      `;
    }

    function appsSlide() {
      const rows = report.apps.map(app => `
        <div class="app-row">
          <div class="app-icon" style="--app-color:${app.color}">${app.icon}</div>
          <div>
            <h3>${app.name}</h3>
            <p>${app.tag}</p>
          </div>
          <strong>${app.time}</strong>
        </div>
      `).join("");

      return `
        <div class="apps-layout">
          <div class="app-hero">
            <div class="orbit-line one"></div>
            <div class="orbit-line two"></div>
            <div class="orbit-line three"></div>
            <div class="app-core"></div>
          </div>
          <div>
            <div class="kicker">APP CONSTELLATION</div>
            <h2 class="title-lg">本月真正陪在你身边的应用</h2>
            <p class="sub">排行榜可以更像“角色卡”。Top 应用作为主角，其余应用像围绕它运转的星群，既保留数据，也更有叙事感。</p>
            <div class="app-list">${rows}</div>
          </div>
        </div>
      `;
    }

    function rhythmSlide() {
      const strips = report.strips.map(strip => `
        <div class="strip">
          <div class="strip-head"><span>${strip.name}</span><span>${strip.apps}</span></div>
          <div class="strip-track">
            ${strip.segs.map(([x, w]) => `<span class="seg" style="--x:${x}; --w:${w}"></span>`).join("")}
          </div>
        </div>
      `).join("");

      return `
        <div class="rhythm-layout">
          <div class="clock-card">
            <div class="clock-face">
              <div>
                <strong>22:40</strong>
                <span>本月最常出现的活跃峰值</span>
              </div>
            </div>
          </div>
          <div>
            <div class="kicker">DAILY RHYTHM</div>
            <h2 class="title-lg">你的时间节律，在晚上明显发光</h2>
            <p class="sub">把时间段做成昼夜节律，会比“上午多少小时、晚上多少小时”更像年度报告，也更容易让用户截图表达自己的生活状态。</p>
            <div class="rhythm-strips">${strips}</div>
          </div>
        </div>
      `;
    }

    function posterSlide() {
      return `
        <div class="poster-layout">
          <div class="share-poster">
            <div class="poster-orbit"></div>
            <div class="poster-content">
              <div class="poster-brand"><span>TimeArc</span><span>${report.month}</span></div>
              <div class="poster-title">我的六月<br>时间人格</div>
              <div class="poster-total">${report.total}</div>
              <p class="poster-caption">${report.persona}。创作、搜索、整理和深夜推进，构成了这个月的个人时间轨迹。</p>
              <div class="poster-foot">
                <div class="poster-mini"><span>TOP APP</span><strong>VS Code</strong></div>
                <div class="poster-mini"><span>PEAK DAY</span><strong>06.18</strong></div>
              </div>
            </div>
          </div>
          <div class="poster-copy">
            <div class="kicker">SHAREABLE SUMMARY</div>
            <h2 class="title-lg">最终给用户一张能发出去的“月度身份卡”</h2>
            <p class="sub">海报不塞满全部数据，只保留总时长、时间人格、Top 应用、峰值日。分享图要像结论，不像后台报表。</p>
            <div class="share-points">
              <div class="share-point"><strong>有称号</strong><span>用户分享的是“我是谁”，不是“我用了多久”。</span></div>
              <div class="share-point"><strong>有主视觉</strong><span>光环、轨道、金色总时长让海报更像纪念卡。</span></div>
              <div class="share-point"><strong>有证据</strong><span>Top 应用和峰值日证明称号来自真实记录。</span></div>
              <div class="share-point"><strong>可迭代</strong><span>未来可以换背景、换人格、换标题，形成月度收集感。</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      slidesEl.innerHTML = slides.map((slide, i) => `
        <article class="slide ${i === active ? "active" : ""}" data-index="${i}">
          ${slide.render()}
        </article>
      `).join("");

      navEl.innerHTML = slides.map((slide, i) => `
        <button class="nav-item ${i === active ? "active" : ""}" type="button" data-index="${i}">
          <span class="nav-num">${String(i + 1).padStart(2, "0")}</span>
          <span>
            <span class="nav-title">${slide.title}</span>
            <span class="nav-desc">${slide.desc}</span>
          </span>
        </button>
      `).join("");

      progressEl.style.setProperty("--p", `${((active + 1) / slides.length) * 100}%`);
      navEl.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => setActive(Number(btn.dataset.index)));
      });
    }

    function setActive(index) {
      active = Math.max(0, Math.min(slides.length - 1, index));
      render();
    }

    document.getElementById("prevBtn").addEventListener("click", () => setActive(active - 1));
    document.getElementById("nextBtn").addEventListener("click", () => setActive(active + 1));
    document.getElementById("posterBtn").addEventListener("click", () => setActive(slides.length - 1));

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowRight" || event.key === " ") setActive(active + 1);
      if (event.key === "ArrowLeft") setActive(active - 1);
    });

    render();
  </script>
</body>
</html>
